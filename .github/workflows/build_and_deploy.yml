name: Build, Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pytest -q

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build admin
        working-directory: admin
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          ADMIN_BASE: '/admin/'
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Collect artifacts for Pages
        run: |
          rm -rf out || true
          mkdir -p out/admin
          cp -r frontend/dist/* out/
          cp -r admin/dist/* out/admin/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: out

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2

  optional-deploy-netlify:
    if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend for Netlify
        working-directory: ./frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Netlify CLI
        run: npm i -g netlify-cli
      - name: Deploy to Netlify
        run: |
          npx netlify deploy --dir=frontend/dist --prod --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  optional-deploy-vercel:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend for Vercel
        working-directory: ./frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Vercel CLI
        run: npm i -g vercel@28
      - name: Deploy to Vercel
        run: |
          vercel --prod --token $VERCEL_TOKEN --confirm --cwd frontend --scope $VERCEL_ORG_ID --project $VERCEL_PROJECT_ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
